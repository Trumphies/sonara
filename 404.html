<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Join the Jam — SONARA</title><style>body{margin:0;background:#FFF8EC;color:#1B1813;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px}main{max-width:420px;width:100%}h1{font-size:22px;margin:0 0 4px}.code{font-size:52px;font-weight:800;letter-spacing:6px;margin:14px 0}.btn{display:block;background:#C14A12;color:#FFF8EC;text-decoration:none;border-radius:999px;padding:15px;font-weight:700;font-size:17px;margin:18px 0}p{color:#6b5d4f;line-height:1.55}</style></head><body><main><h1>Join the Jam</h1><p id="msg">Opening SONARA…</p><div class="code" id="code">······</div><a class="btn" id="openBtn" href="#">Open in SONARA</a><p id="manual">Or open SONARA and enter this code on the Jam screen.</p><p id="noapp" style="display:none">If SONARA isn't installed yet, install it first, then tap the button above or enter the code manually.</p><script>(function(){var m=window.location.pathname.match(/\/jam\/([A-Za-z0-9]{6})/);var q=new URLSearchParams(window.location.search).get('c');var raw=(m&&m[1])||(q||'');var code=raw.toUpperCase().replace(/[^A-Z0-9]/g,'');var valid=/^[A-Z2-9]{6}$/.test(code)&&!/0|1|O|I/.test(code);var codeEl=document.getElementById('code'),msg=document.getElementById('msg'),btn=document.getElementById('openBtn');if(!valid){codeEl.textContent='······';msg.textContent='This Jam link has no valid code. Ask the host to share the invite again.';btn.style.display='none';document.getElementById('manual').style.display='none';return;}codeEl.textContent=code;var intent='intent://jam/'+code+'#Intent;scheme=sonara;package=com.sonara.app;end';btn.href=intent;var isAndroid=/Android/i.test(navigator.userAgent);if(isAndroid){setTimeout(function(){window.location.href=intent;},400);setTimeout(function(){document.getElementById('noapp').style.display='block';},2500);}else{msg.textContent='SONARA is an Android app. Open this link on your Android phone, or enter the code below in the app:';}})();</script></main></body></html>
